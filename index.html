    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mini-Projet</title>
        <link rel="stylesheet" href="css/index.css">
    </head>
    <body>
        <main id="photo">
            <h1 id="la_photo_titre">Photo </h1>

            <section id="la_photo"></section>
        </main>

        <script id="photoTemplate" type="text/x-handlebars-template">
            <img src="{{url}}" alt="{{titre}}">
            <h2>{{titre}}</h2>
            <p> - {{description}}</p>
            <p> - {{format}}, {{width}} x {{height}}</p>
            <p> - Id de la Photo : <strong>{{id}}</strong></p>
            <h2 id="la_categorie">categorie :</h2>

            <h2>Commentaires :</h2>
            <ul id="les_commentaires"></ul>
        </script>
        <br>

        <hr>

        <!-- Galerie -->
        <h1 id="galerie">Galerie Photo</h1>

        <section id="navigation">
            <button id="first">first</button>
            <button id="prev">prev</button>
            <button id="load_gallery">load</button>
            <button id="next">next</button>
            <button id="last">last</button>
        </section>

        <section id="gallery_container"></section>
        <script id="galleryTemplate" type="text/x-handlebars-template">
        <section id="la_galerie">
            {{#each photos}}
            <img
                src="https://webetu.iutnc.univ-lorraine.fr{{photo.thumbnail.href}}"
                alt="{{photo.titre}}"
                data-photoId="{{photo.id}}"
            >
            {{/each}}
        </section>
        </script>

        <section id="lightbox" class="hidden">
            <button id="close_lightbox">X</button>
            <button id="prev_lightbox">&lt;</button>

            <div id="lightbox_content">
                <img id="lightbox_img" src="" alt="">
                <h2 id="lightbox_title"></h2>
            </div>

            <button id="next_lightbox">&gt;</button>
        </section>

        <script src="dist/bundle.js"></script>
    </body>
    </html>
